<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ernani Mendes da Fonseca Neto — Desenvolvedor de Sistemas com IA">
  <title>Ernani Mendes da Fonseca Neto — Desenvolvedor de Sistemas com IA</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#120A24"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF">
        <animate attributeName="stop-color" values="#00D9FF;#8B5CF6;#00D9FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#E6EDF3"/>
      <stop offset="1" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#00D9FF;#8B5CF6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#00D9FF" stop-opacity=".35"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".35"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1F2A3D" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="320" fill="url(#gridFade)"/></mask>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00D9FF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .t { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .m { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; }
    .fade { opacity: 0; animation: in .9s ease-out forwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s } .d4 { animation-delay: 1.05s }
    @keyframes in { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
    .node { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .45; transform: scale(1) } 50% { opacity: 1; transform: scale(1.35) } }
    .edge { stroke-dasharray: 4 6; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -40 } }
    .chip { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1 } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- drifting light orbs -->
    <circle cx="180" cy="80" r="220" fill="url(#orbA)">
      <animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;140;80" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="260" r="240" fill="url(#orbB)">
      <animate attributeName="cx" values="1020;880;1020" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;190;260" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- neural network (right side) -->
    <g transform="translate(885 72) scale(.88)" stroke="#00D9FF" stroke-opacity=".45" stroke-width="1.2" fill="none">
      <path class="edge" d="M0 30L110 0M0 30L110 70M0 30L110 140M0 110L110 0M0 110L110 70M0 110L110 140M0 190L110 70M0 190L110 140M0 190L110 210"/>
      <path class="edge" style="animation-delay:-.8s" d="M110 0L230 50M110 70L230 50M110 70L230 150M110 140L230 50M110 140L230 150M110 210L230 150"/>
      <path class="edge" style="animation-delay:-1.6s" stroke="#8B5CF6" d="M230 50L320 100M230 150L320 100"/>
    </g>
    <g transform="translate(885 72) scale(.88)" filter="url(#glow)">
      <circle class="node" cx="0" cy="30" r="5" fill="#00D9FF"/>
      <circle class="node" cx="0" cy="110" r="5" fill="#00D9FF" style="animation-delay:.4s"/>
      <circle class="node" cx="0" cy="190" r="5" fill="#00D9FF" style="animation-delay:.8s"/>
      <circle class="node" cx="110" cy="0" r="5" fill="#5EE7FF" style="animation-delay:1.2s"/>
      <circle class="node" cx="110" cy="70" r="5" fill="#5EE7FF" style="animation-delay:.2s"/>
      <circle class="node" cx="110" cy="140" r="5" fill="#5EE7FF" style="animation-delay:.6s"/>
      <circle class="node" cx="110" cy="210" r="5" fill="#5EE7FF" style="animation-delay:1s"/>
      <circle class="node" cx="230" cy="50" r="6" fill="#A78BFA" style="animation-delay:1.4s"/>
      <circle class="node" cx="230" cy="150" r="6" fill="#A78BFA" style="animation-delay:.3s"/>
      <circle class="node" cx="320" cy="100" r="8" fill="#8B5CF6" style="animation-delay:.9s"/>
    </g>

    <!-- text block -->
    <g class="t">
      <g class="fade d1">
        <rect x="64" y="58" width="236" height="30" rx="15" fill="#00D9FF" fill-opacity=".08" stroke="#00D9FF" stroke-opacity=".45"/>
        <circle cx="84" cy="73" r="4.5" fill="#3FB950">
          <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="98" y="78" class="m" font-size="13" fill="#9FEFFF">disponível para conversar</text>
      </g>
      <text x="62" y="148" font-size="50" font-weight="800" fill="url(#name)" class="fade d2" letter-spacing="-.5">Ernani Mendes da Fonseca Neto</text>
      <text x="64" y="190" font-size="22" fill="#C9D1D9" class="fade d3">Desenvolvedor de Sistemas com IA  ·  Engenheiro da Computação</text>
      <g class="fade d4 m" font-size="14">
        <g class="chip">
          <rect x="64" y="222" width="126" height="30" rx="8" fill="#161B22" stroke="#30363D"/>
          <text x="127" y="242" text-anchor="middle" fill="#00D9FF">LLMs &amp; IA</text>
        </g>
        <g class="chip" style="animation-delay:-1.5s">
          <rect x="200" y="222" width="104" height="30" rx="8" fill="#161B22" stroke="#30363D"/>
          <text x="252" y="242" text-anchor="middle" fill="#F5A97F">Rust</text>
        </g>
        <g class="chip" style="animation-delay:-3s">
          <rect x="314" y="222" width="126" height="30" rx="8" fill="#161B22" stroke="#30363D"/>
          <text x="377" y="242" text-anchor="middle" fill="#79C0FF">TypeScript</text>
        </g>
        <g class="chip" style="animation-delay:-4.5s">
          <rect x="450" y="222" width="96" height="30" rx="8" fill="#161B22" stroke="#30363D"/>
          <text x="498" y="242" text-anchor="middle" fill="#FFD866">Python</text>
        </g>
        <g class="chip" style="animation-delay:-2.2s">
          <rect x="556" y="222" width="132" height="30" rx="8" fill="#161B22" stroke="#30363D"/>
          <text x="622" y="242" text-anchor="middle" fill="#7EE787">QA &amp; Testes</text>
        </g>
      </g>
      <text x="64" y="288" class="m fade d4" font-size="13" fill="#6E7681">Campo Grande · MS · Brasil</text>
    </g>

    <!-- scanning line -->
    <rect x="-300" y="317" width="300" height="3" fill="url(#scan)">
      <animate attributeName="x" values="-300;1200" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect width="1199" height="319" x=".5" y=".5" rx="18" fill="none" stroke="#30363D"/>
  </g>
</svg>
