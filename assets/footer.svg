              M0 80 C 250 110, 450 50, 700 80 S 1050 110, 1200 80 V120 H0 Z;
              M0 80 C 250 50, 450 110, 700 80 S 1050 50, 1200 80 V120 H0 Z"/>
  </path>
  <path fill="url(#w)" fill-opacity=".7">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="M0 100 C 300 85, 600 115, 900 100 S 1150 90, 1200 100 V120 H0 Z;
