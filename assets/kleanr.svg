<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Ilustração do Kleanr: análise de uso de disco por pasta">
  <title>Kleanr</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0A1A1A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Ubuntu, Arial, sans-serif; }
    .m { font-family: 'Cascadia Code', Consolas, monospace; }
    .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1) } }
    .arc { stroke-dasharray: 440; stroke-dashoffset: 440; animation: arc 2s ease-out .3s forwards; }
    @keyframes arc { to { stroke-dashoffset: 132 } }
    .in { opacity: 0; animation: in .5s ease-out forwards; }
    @keyframes in { to { opacity: 1 } }
    .sweep { animation: sweep 3s linear infinite; }
    @keyframes sweep { from { transform: translateY(0) } to { transform: translateY(250px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } .bar { transform: none } .in { opacity: 1 } .arc { stroke-dashoffset: 132 } }
  </style>
  <rect width="800" height="450" rx="16" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="799" height="449" rx="16" fill="none" stroke="#30363D"/>

  <!-- window bar -->
  <rect x="24" y="22" width="752" height="34" rx="8" fill="#161B22"/>
  <circle cx="44" cy="39" r="5" fill="#FF5F57"/><circle cx="60" cy="39" r="5" fill="#FEBC2E"/><circle cx="76" cy="39" r="5" fill="#28C840"/>
  <text x="400" y="44" text-anchor="middle" class="m" font-size="12" fill="#8B949E">127.0.0.1:8765 — Kleanr</text>

  <!-- donut -->
  <g transform="translate(160 220)">
    <circle r="70" fill="none" stroke="#21262D" stroke-width="18"/>
    <circle class="arc" r="70" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round" transform="rotate(-90)"/>
    <text y="-2" text-anchor="middle" class="t" font-size="30" font-weight="800" fill="#E6EDF3">70%</text>
    <text y="22" text-anchor="middle" class="t" font-size="12" fill="#8B949E">C:\ em uso</text>
  </g>
  <text x="160" y="330" text-anchor="middle" class="t in" style="animation-delay:1.6s" font-size="14" fill="#34D399">↓ 18,4 GB liberáveis</text>

  <!-- folders -->
  <g class="t" font-size="13">
    <text x="300" y="100" fill="#C9D1D9">Users\AppData\Temp</text>
    <rect x="300" y="108" width="440" height="12" rx="6" fill="#21262D"/>
    <rect class="bar" style="animation-delay:.2s" x="300" y="108" width="380" height="12" rx="6" fill="#34D399"/>
    <text x="740" y="100" text-anchor="end" class="m in" style="animation-delay:1s" fill="#34D399">seguro · 9,2 GB</text>

    <text x="300" y="150" fill="#C9D1D9">Downloads (duplicatas)</text>
    <rect x="300" y="158" width="440" height="12" rx="6" fill="#21262D"/>
    <rect class="bar" style="animation-delay:.4s" x="300" y="158" width="260" height="12" rx="6" fill="#00D9FF"/>
    <text x="740" y="150" text-anchor="end" class="m in" style="animation-delay:1.2s" fill="#00D9FF">revisar · 6,1 GB</text>

    <text x="300" y="200" fill="#C9D1D9">Windows\SoftwareDistribution</text>
    <rect x="300" y="208" width="440" height="12" rx="6" fill="#21262D"/>
    <rect class="bar" style="animation-delay:.6s" x="300" y="208" width="150" height="12" rx="6" fill="#34D399"/>
    <text x="740" y="200" text-anchor="end" class="m in" style="animation-delay:1.4s" fill="#34D399">seguro · 3,1 GB</text>

    <text x="300" y="250" fill="#C9D1D9">Program Files</text>
    <rect x="300" y="258" width="440" height="12" rx="6" fill="#21262D"/>
    <rect class="bar" style="animation-delay:.8s" x="300" y="258" width="420" height="12" rx="6" fill="#F85149"/>
    <text x="740" y="250" text-anchor="end" class="m in" style="animation-delay:1.6s" fill="#F85149">manter · 41 GB</text>
  </g>

  <!-- AI question -->
  <g class="in t" style="animation-delay:2.2s">
    <rect x="300" y="300" width="440" height="96" rx="12" fill="#161B22" stroke="#30363D"/>
    <text x="320" y="330" font-size="13" fill="#8B949E">✦ Pergunte à IA</text>
    <text x="320" y="354" font-size="14" fill="#E6EDF3">“O que é essa pasta node_modules de 4 GB?”</text>
    <text x="320" y="378" font-size="13" fill="#7EE787">→ Dependências de projeto; pode ser recriada com npm i.</text>
  </g>

  <!-- scanning line over folders -->
  <rect class="sweep" x="296" y="80" width="448" height="2" fill="#34D399" fill-opacity=".5"/>
</svg>
